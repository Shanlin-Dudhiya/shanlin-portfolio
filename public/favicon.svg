<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sd-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141527" />
      <stop offset="100%" stop-color="#0a0a14" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="sd-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="sd-text" x1="10" y1="18" x2="54" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <radialGradient id="sd-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#sd-glow)" />

  <!-- Base Rounded Squircle -->
  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="16"
    fill="url(#sd-bg)"
    stroke="url(#sd-border)"
    stroke-width="2.5"
  />

  <!-- Subtle Top Highlight -->
  <path
    d="M12 7h40c5 0 9 4 9 9v2H3v-2c0-5 4-9 9-9z"
    fill="#ffffff"
    opacity="0.04"
  />

  <!-- High-Contrast Crisp SD Monogram -->
  <g transform="translate(0, 0)">
    <text
      x="30"
      y="43"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="28"
      font-weight="800"
      letter-spacing="-1.2"
      fill="url(#sd-text)"
    >SD</text>

    <!-- Tech Cyan Accent Dot -->
    <circle cx="49" cy="41" r="3.2" fill="#06b6d4" />
    <circle cx="49" cy="41" r="1.5" fill="#ffffff" />
  </g>
</svg>
